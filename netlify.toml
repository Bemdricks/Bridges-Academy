[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite inlines VITE_* variables at build time. Set these in
# Site configuration → Environment variables before deploying:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY

# The app navigates in place, but this serves index.html for any
# direct visit so Netlify does not return a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
